name: Validate registry

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - run: python scripts/validate_index.py --self-test
      - run: python scripts/validate_index.py --network
      - run: python scripts/sign_index.py --prepare-only
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python scripts/validate_index.py dist/index.json
      - run: python scripts/validate_index.py dist/index-v2.json
